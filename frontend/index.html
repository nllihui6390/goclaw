<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>go-claw 个人助手</title>
    <!-- Fonts: JetBrains Mono + Inter Tight -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <meta name="theme-color" content="#0d0f12" />
    <!-- Sync theme: detect system preference + saved setting BEFORE paint -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('goclaw_theme');
          var isDark;
          if (saved === 'light') {
            isDark = false;
          } else if (saved === 'dark') {
            isDark = true;
          } else {
            // system preference (default to dark for this app)
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.className = 'dark';
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch(e) {}
      })();
    </script>
    <style>
      html, body { background: #f5f6f8; margin: 0; padding: 0; }
      html.dark, html.dark body { background: #0d0f12; }
      /* Prevent FOUC if JS is delayed */
      body { transition: background 0.15s ease; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
